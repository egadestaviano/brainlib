<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" rx="12" fill="#f8fafc"/>
  <!-- Left panel (blue branding) -->
  <rect x="20" y="20" width="320" height="260" rx="12" fill="url(#loginGrad)"/>
  <text x="50" y="60" font-family="system-ui" font-size="18" font-weight="700" fill="white">BrainLib</text>
  <text x="50" y="130" font-family="system-ui" font-size="16" font-weight="600" fill="white">Empower your</text>
  <text x="50" y="152" font-family="system-ui" font-size="16" font-weight="600" fill="white">learning journey</text>
  <text x="50" y="174" font-family="system-ui" font-size="16" font-weight="600" fill="white">with AI</text>
  <text x="50" y="250" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.6)">© 2026 BrainLib. All rights reserved.</text>
  <!-- Right panel (login form) -->
  <rect x="370" y="20" width="410" height="260" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="60" font-family="system-ui" font-size="16" font-weight="700" fill="#0f172a">Sign in to Brainlib</text>
  <text x="400" y="80" font-family="system-ui" font-size="11" fill="#64748b">Enter your credentials to access your account</text>
  <!-- Email field -->
  <text x="400" y="110" font-family="system-ui" font-size="11" font-weight="500" fill="#334155">Email</text>
  <rect x="400" y="116" width="350" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="412" y="136" font-family="system-ui" font-size="11" fill="#94a3b8">you@example.com</text>
  <!-- Password field -->
  <text x="400" y="168" font-family="system-ui" font-size="11" font-weight="500" fill="#334155">Password</text>
  <rect x="400" y="174" width="350" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="412" y="194" font-family="system-ui" font-size="11" fill="#94a3b8">Enter your password</text>
  <!-- Sign In button -->
  <rect x="400" y="220" width="350" height="36" rx="8" fill="#0f172a"/>
  <text x="545" y="242" font-family="system-ui" font-size="12" font-weight="600" fill="white">Sign In</text>
  <!-- Demo buttons -->
  <rect x="400" y="264" width="170" height="28" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="445" y="282" font-family="system-ui" font-size="10" fill="#475569">Demo Teacher</text>
  <rect x="580" y="264" width="170" height="28" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="625" y="282" font-family="system-ui" font-size="10" fill="#475569">Demo Student</text>
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>
