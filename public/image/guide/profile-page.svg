<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" rx="12" fill="#f8fafc"/>
  
  <!-- Profile hero card -->
  <rect x="20" y="20" width="760" height="130" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="20" width="760" height="50" rx="12" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  
  <!-- Avatar -->
  <rect x="40" y="50" width="50" height="50" rx="12" fill="#3b82f6" stroke="white" stroke-width="3"/>
  <text x="55" y="82" font-family="system-ui" font-size="22" font-weight="700" fill="white">U</text>
  
  <!-- Name and info -->
  <text x="105" y="90" font-family="system-ui" font-size="16" font-weight="700" fill="#0f172a">John Doe</text>
  <text x="105" y="108" font-family="system-ui" font-size="11" fill="#64748b">john.doe@example.com</text>
  
  <!-- Role badges -->
  <rect x="105" y="118" width="55" height="20" rx="10" fill="#ede9fe"/>
  <text x="115" y="132" font-family="system-ui" font-size="9" font-weight="600" fill="#7c3aed">TEACHER</text>
  <rect x="168" y="118" width="45" height="20" rx="10" fill="#dbeafe"/>
  <text x="176" y="132" font-family="system-ui" font-size="9" font-weight="600" fill="#2563eb">ACTIVE</text>
  
  <!-- Edit Profile form -->
  <rect x="20" y="165" width="490" height="115" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="45" y="192" font-family="system-ui" font-size="13" font-weight="600" fill="#0f172a">Edit Profile</text>
  <text x="45" y="207" font-family="system-ui" font-size="10" fill="#64748b">Update how others see you</text>
  
  <!-- Form fields -->
  <rect x="45" y="220" width="200" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="238" font-family="system-ui" font-size="11" fill="#94a3b8">Display Name</text>
  <rect x="260" y="220" width="230" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="270" y="238" font-family="system-ui" font-size="11" fill="#94a3b8">Bio</text>
  
  <!-- Save button -->
  <rect x="420" y="258" width="75" height="26" rx="6" fill="#2563eb"/>
  <text x="433" y="275" font-family="system-ui" font-size="10" font-weight="500" fill="white">Save Changes</text>
  
  <!-- Account info panel -->
  <rect x="525" y="165" width="255" height="115" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="550" y="192" font-family="system-ui" font-size="13" font-weight="600" fill="#0f172a">Account</text>
  <text x="550" y="207" font-family="system-ui" font-size="10" fill="#64748b">Read-only details</text>
  
  <text x="550" y="232" font-family="system-ui" font-size="9" font-weight="600" fill="#64748b">EMAIL</text>
  <text x="550" y="245" font-family="system-ui" font-size="11" fill="#0f172a">john.doe@example.com</text>
  <text x="550" y="265" font-family="system-ui" font-size="9" font-weight="600" fill="#64748b">MEMBER SINCE</text>
  <text x="550" y="278" font-family="system-ui" font-size="11" fill="#0f172a">January 15, 2024</text>
</svg>
