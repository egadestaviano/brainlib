<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" rx="12" fill="#f8fafc"/>
  <!-- Left panel (blue branding) -->
  <rect x="20" y="20" width="320" height="260" rx="12" fill="url(#regGrad)"/>
  <text x="50" y="60" font-family="system-ui" font-size="18" font-weight="700" fill="white">BrainLib</text>
  <text x="50" y="130" font-family="system-ui" font-size="16" font-weight="600" fill="white">Empower your</text>
  <text x="50" y="152" font-family="system-ui" font-size="16" font-weight="600" fill="white">learning journey</text>
  <text x="50" y="174" font-family="system-ui" font-size="16" font-weight="600" fill="white">with AI</text>
  <text x="50" y="250" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.6)">© 2026 BrainLib. All rights reserved.</text>
  <!-- Right panel (register form) -->
  <rect x="370" y="20" width="410" height="260" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="55" font-family="system-ui" font-size="16" font-weight="700" fill="#0f172a">Create your Brainlib account</text>
  <text x="400" y="72" font-family="system-ui" font-size="11" fill="#64748b">Start your learning journey today</text>
  <!-- Full Name field -->
  <text x="400" y="95" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Full Name</text>
  <rect x="400" y="100" width="350" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="118" font-family="system-ui" font-size="10" fill="#94a3b8">John Doe</text>
  <!-- Email field -->
  <text x="400" y="143" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Email</text>
  <rect x="400" y="148" width="350" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="166" font-family="system-ui" font-size="10" fill="#94a3b8">you@example.com</text>
  <!-- Password field -->
  <text x="400" y="191" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Password</text>
  <rect x="400" y="196" width="170" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Confirm Password -->
  <text x="580" y="191" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Confirm</text>
  <rect x="580" y="196" width="170" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Role selector -->
  <text x="400" y="241" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Register As</text>
  <rect x="400" y="246" width="350" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="264" font-family="system-ui" font-size="10" fill="#475569">Student (Learning &amp; Joining classes)</text>
  <!-- Chevron -->
  <path d="M730 258 L735 263 L740 258" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <defs>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>
