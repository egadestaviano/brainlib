<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <rect width="800" height="320" rx="12" fill="#f8fafc"/>

  <!-- Top bar: showing the + Add Lesson button highlighted -->
  <rect x="20" y="15" width="760" height="40" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="38" font-family="system-ui" font-size="13" font-weight="600" fill="#1d4ed8">Lessons</text>
  <text x="100" y="38" font-family="system-ui" font-size="11" fill="#64748b">3</text>
  <text x="130" y="38" font-family="system-ui" font-size="13" fill="#64748b">Students</text>
  <text x="200" y="38" font-family="system-ui" font-size="11" fill="#64748b">22</text>
  <!-- + Add Lesson button - HIGHLIGHTED -->
  <rect x="640" y="23" width="120" height="28" rx="7" fill="#3b82f6"/>
  <text x="658" y="41" font-family="system-ui" font-size="11" font-weight="600" fill="white">+ Add Lesson</text>
  <!-- Highlight ring -->
  <rect x="636" y="19" width="128" height="36" rx="9" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Label -->
  <rect x="656" y="6" width="80" height="14" rx="3" fill="#f59e0b"/>
  <text x="660" y="16" font-family="system-ui" font-size="8" font-weight="600" fill="white">ADD LESSON</text>

  <!-- Backdrop overlay -->
  <rect x="20" y="65" width="760" height="245" rx="12" fill="#0f172a" opacity="0.25"/>

  <!-- Modal card - HIGHLIGHTED -->
  <rect x="120" y="68" width="560" height="240" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="116" y="64" width="568" height="248" rx="18" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Label for dialog -->
  <rect x="340" y="52" width="80" height="14" rx="3" fill="#f59e0b"/>
  <text x="346" y="62" font-family="system-ui" font-size="8" font-weight="600" fill="white">NEW LESSON</text>

  <!-- Header -->
  <rect x="145" y="82" width="40" height="40" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="157" y="108" font-family="system-ui" font-size="16" fill="#2563eb">📖</text>
  <text x="196" y="98" font-family="system-ui" font-size="14" font-weight="600" fill="#0f172a">Create New Lesson</text>
  <text x="196" y="113" font-family="system-ui" font-size="9" fill="#64748b">Fill in lesson details, then add content blocks.</text>
  <!-- Tabs -->
  <text x="145" y="140" font-family="system-ui" font-size="11" font-weight="600" fill="#1d4ed8">📋 Details</text>
  <line x1="145" y1="145" x2="210" y2="145" stroke="#3b82f6" stroke-width="2"/>
  <text x="225" y="140" font-family="system-ui" font-size="11" fill="#64748b">📦 Content</text>
  <!-- Divider -->
  <line x1="145" y1="148" x2="655" y2="148" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Title field -->
  <text x="145" y="168" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Lesson Title *</text>
  <rect x="145" y="172" width="510" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="157" y="190" font-family="system-ui" font-size="10" fill="#94a3b8">e.g. Introduction to Algebra</text>
  <!-- Description field -->
  <text x="145" y="216" font-family="system-ui" font-size="10" font-weight="500" fill="#334155">Description *</text>
  <rect x="145" y="220" width="510" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="157" y="240" font-family="system-ui" font-size="10" fill="#94a3b8">What will students learn in this lesson?</text>
  <!-- Footer -->
  <rect x="120" y="268" width="560" height="40" fill="#f8fafc"/>
  <line x1="120" y1="268" x2="680" y2="268" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="145" y="276" width="55" height="22" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="157" y="291" font-family="system-ui" font-size="10" fill="#475569">Cancel</text>
  <rect x="555" y="276" width="105" height="22" rx="5" fill="#3b82f6"/>
  <text x="563" y="291" font-family="system-ui" font-size="10" font-weight="500" fill="white">Continue to Content →</text>
</svg>
