<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <!-- Background (dark overlay simulation) -->
  <rect width="800" height="300" rx="12" fill="#1e293b" opacity="0.6"/>
  <!-- Cutout area (highlighted element) -->
  <rect x="250" y="60" width="300" height="50" rx="10" fill="#f8fafc"/>
  <rect x="250" y="60" width="300" height="50" rx="10" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- Simulated button inside cutout -->
  <rect x="270" y="72" width="260" height="26" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="90" font-family="system-ui" font-size="12" fill="#475569">Create Class</text>
  <!-- Tooltip -->
  <rect x="240" y="125" width="320" height="145" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Shadow effect -->
  <rect x="243" y="128" width="320" height="145" rx="12" fill="black" opacity="0.05"/>
  <!-- Step indicator -->
  <text x="260" y="150" font-family="system-ui" font-size="10" fill="#94a3b8">3 / 5</text>
  <text x="510" y="150" font-family="system-ui" font-size="10" fill="#94a3b8">Skip</text>
  <!-- Title -->
  <text x="260" y="175" font-family="system-ui" font-size="14" font-weight="700" fill="#1e293b">Create or Join</text>
  <!-- Description -->
  <text x="260" y="195" font-family="system-ui" font-size="11" fill="#475569">Teachers can create new classes.</text>
  <text x="260" y="210" font-family="system-ui" font-size="11" fill="#475569">Students can join using a class code.</text>
  <!-- Buttons -->
  <rect x="260" y="230" width="70" height="26" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="275" y="247" font-family="system-ui" font-size="10" fill="#475569">Previous</text>
  <rect x="470" y="230" width="70" height="26" rx="6" fill="#2563eb"/>
  <text x="492" y="247" font-family="system-ui" font-size="10" fill="white">Next</text>
</svg>
