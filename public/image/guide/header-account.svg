<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" fill="none">
  <!-- Background -->
  <rect width="800" height="180" rx="12" fill="#f8fafc"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Hamburger menu -->
  <rect x="38" y="36" width="20" height="3" rx="1.5" fill="#475569"/>
  <rect x="38" y="42" width="20" height="3" rx="1.5" fill="#475569"/>
  <rect x="38" y="48" width="20" height="3" rx="1.5" fill="#475569"/>
  <!-- Highlight ring around hamburger -->
  <rect x="30" y="30" width="36" height="30" rx="6" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- User avatar -->
  <circle cx="745" cy="45" r="16" fill="url(#avatarGrad)"/>
  <text x="740" y="50" font-family="system-ui" font-size="12" font-weight="600" fill="white">J</text>
  <!-- Highlight ring around avatar -->
  <circle cx="745" cy="45" r="20" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Popover dropdown -->
  <rect x="620" y="75" width="160" height="95" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Arrow -->
  <polygon points="740,75 748,68 732,68" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- User info in popover -->
  <circle cx="645" cy="98" r="12" fill="url(#avatarGrad2)"/>
  <text x="641" y="102" font-family="system-ui" font-size="9" font-weight="600" fill="white">J</text>
  <text x="663" y="95" font-family="system-ui" font-size="11" font-weight="500" fill="#1e293b">John Smith</text>
  <text x="663" y="108" font-family="system-ui" font-size="9" fill="#94a3b8">john@example.com</text>
  <!-- Divider -->
  <rect x="635" y="118" width="130" height="1" fill="#f1f5f9"/>
  <!-- Menu items -->
  <text x="645" y="138" font-family="system-ui" font-size="11" fill="#475569">Profile</text>
  <text x="645" y="158" font-family="system-ui" font-size="11" fill="#ef4444">Logout</text>
  <!-- Gradient defs -->
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>
